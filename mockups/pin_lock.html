<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinoy POS — PIN Lock Mockup</title>
<link rel="stylesheet" href="mockup.css">
</head>
<body>

<div class="page-head">
  <div>
    <h1>PIN Lock</h1>
    <p>Secondary auth after password login.</p>
  </div>
  <button class="theme-toggle" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8z"/></svg>
    <span id="themeLabel">Light mode</span>
  </button>
</div>

<div class="frames">
  <div class="frame-wrap">
    <div class="frame-label">PIN Lock</div>
    <div class="phone">
      <div class="statusbar"><span>9:41</span>
        <span class="icons">
          <svg viewBox="0 0 24 24"><path d="M12 21l3.5-4.5c-.97-.74-2.18-1.16-3.5-1.16s-2.53.42-3.5 1.16L12 21zM12 3C7.31 3 3.07 4.69 0 7.55l1.93 2.43C4.48 7.9 8.01 6.4 12 6.4s7.52 1.5 10.07 3.58L24 7.55C20.93 4.69 16.69 3 12 3z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
        </span>
      </div>
      <div class="screen center-screen" style="padding:32px 24px;gap:18px;justify-content:flex-start;padding-top:60px;">
        <div class="icircle lg" style="background:var(--surface-elev);border:2px solid var(--border);font-size:22px;font-weight:700;color:var(--text);">JD</div>
        <div class="title" style="font-size:22px;">Juan Dela Cruz</div>
        <div class="msg" style="margin-top:-10px;">@juan.owner</div>

        <div style="font-size:15px;color:var(--text-3);margin-top:24px;">Enter your PIN</div>

        <div class="pin-dots" id="pinDots">
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
          <div class="pin-dot"></div>
        </div>

        <div class="pin-keypad" style="margin-top:16px;">
          <div class="pin-key" data-d="1">1</div>
          <div class="pin-key" data-d="2">2</div>
          <div class="pin-key" data-d="3">3</div>
          <div class="pin-key" data-d="4">4</div>
          <div class="pin-key" data-d="5">5</div>
          <div class="pin-key" data-d="6">6</div>
          <div class="pin-key" data-d="7">7</div>
          <div class="pin-key" data-d="8">8</div>
          <div class="pin-key" data-d="9">9</div>
          <div class="pin-key" style="visibility:hidden;"></div>
          <div class="pin-key" data-d="0">0</div>
          <div class="pin-key" data-d="back" style="font-size:14px;">
            <svg viewBox="0 0 24 24" style="width:22px;height:22px;fill:var(--text);"><path d="M22 3H7c-.69 0-1.23.35-1.59.88L0 12l5.41 8.11c.36.53.97.89 1.66.89H22c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-3.47 13.09L17.09 14.5 13.5 10.91l-3.59 3.59L8.32 13.41 11.91 9.82 8.32 6.23 9.91 4.64 13.5 8.23 17.09 4.64 18.68 6.23 15.09 9.82 18.68 13.41 15.09 17z"/></svg>
          </div>
        </div>

        <button class="btn btn-error" style="margin-top:28px;max-width:260px;" onclick="showToast('Returned to login', 'info')">
          <svg viewBox="0 0 24 24"><path d="M17 7l-1.41 1.41L18.17 11H8v2h10.17l-2.58 2.58L17 17l5-5-5-5zM4 5h8V3H4c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h8v-2H4V5z"/></svg> Back to Login
        </button>
      </div>
    </div>
    <div class="frame-notes">
      <b>PIN Lock:</b> No AppBar. User avatar, name, PIN dots and numeric keypad. Auto-submit when 4 digits are entered. Android back is blocked; only "Back to Login" is allowed.
    </div>
  </div>
</div>

<script src="mockup.js"></script>
<script>setPinDigit(4);</script>
</body>
</html>
