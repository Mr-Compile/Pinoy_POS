<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pinoy POS — Splash Mockup</title>
<link rel="stylesheet" href="mockup.css">
</head>
<body>

<div class="page-head">
  <div>
    <h1>Splash</h1>
    <p>Shown while the app restores the auth session.</p>
  </div>
  <button class="theme-toggle" onclick="toggleTheme()">
    <svg viewBox="0 0 24 24"><path d="M12 3c-4.97 0-9 4.03-9 9s4.03 9 9 9c.83 0 1.5-.67 1.5-1.5 0-.39-.15-.74-.39-1.01-.23-.26-.38-.61-.38-.99 0-.83.67-1.5 1.5-1.5H16c2.76 0 5-2.24 5-5 0-4.42-4.03-8-9-8z"/></svg>
    <span id="themeLabel">Light mode</span>
  </button>
</div>

<div class="frames">
  <div class="frame-wrap">
    <div class="frame-label">Splash</div>
    <div class="phone">
      <div class="statusbar"><span>9:41</span>
        <span class="icons">
          <svg viewBox="0 0 24 24"><path d="M12 21l3.5-4.5c-.97-.74-2.18-1.16-3.5-1.16s-2.53.42-3.5 1.16L12 21zM12 3C7.31 3 3.07 4.69 0 7.55l1.93 2.43C4.48 7.9 8.01 6.4 12 6.4s7.52 1.5 10.07 3.58L24 7.55C20.93 4.69 16.69 3 12 3z"/></svg>
          <svg viewBox="0 0 24 24"><path d="M15.67 4H14V2h-4v2H8.33C7.6 4 7 4.6 7 5.33v15.33C7 21.4 7.6 22 8.33 22h7.33c.74 0 1.34-.6 1.34-1.33V5.33C17 4.6 16.4 4 15.67 4z"/></svg>
        </span>
      </div>
      <div class="screen center-screen" style="padding:24px;gap:24px;">
        <div class="splash-logo">
          <svg viewBox="0 0 24 24"><path d="M20 4H4c-1.11 0-1.99.89-1.99 2L2 18c0 1.11.89 2 2 2h16c1.11 0 2-.89 2-2V6c0-1.11-.89-2-2-2zm0 14H4v-6h16v6zm0-10H4V6h16v2z"/></svg>
        </div>
        <div class="title" style="font-size:28px;">Pinoy POS</div>
        <div class="msg">Simple. Offline. Reliable.</div>
        <div class="spinner" style="margin-top:20px;"></div>
      </div>
    </div>
    <div class="frame-notes">
      <b>Splash:</b> No AppBar. Centered logo, app name, tagline and a CircularProgressIndicator while Riverpod auth state is initialized.
    </div>
  </div>
</div>

<script src="mockup.js"></script>
</body>
</html>
